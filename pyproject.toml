[project]
name = "letsgosa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=48.0.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28.1",
    "minio>=7.2.20",
    "pydantic>=2.8,<3.0",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.30",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.2,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.2,<9.0",
]
