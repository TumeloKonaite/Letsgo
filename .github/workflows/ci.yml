name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend/src
      LETSGOSA_ENV: test
      LETSGOSA_DATABASE_URL: sqlite:///./letsgosa.db
      CORS_ORIGINS: http://localhost:5173
      CLERK_SECRET_KEY: sk_test_synthetic
      CLERK_JWT_KEY: |
        -----BEGIN PUBLIC KEY-----
        MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA5nhAUsF4yGsMxkuAnXMX
        yzHzrpah8+DlwvHp8nifUbbfbWe5n1RXimcCEKnrcwxOqh0C2mWjpXl1eSZUIBuY
        CU4ikpI1O3vb7wY2wpYGDR9Adw2BGKpo/+NKA6uUiWRhj24YN/P5PuctqrNRnRRg
        q3S9BOu9zy7ce82VJ5o0tPVUsTsQ3TtzcLDvZtCfJewY5JbjEao1t3ZIGGkFJW+z
        4vsc+dEdhHvh5L8dOEPxUoH+YTx0GfO1PJQOyT+B+IkvRyhlgUYVprMTwmKI2/xj
        iD80dQjQOIQJW8nX7TLOZdFpUhdbzQXj/hTDAXECnCRka9NLDxPmWxPvrQC4n2k1
        gQIDAQAB
        -----END PUBLIC KEY-----
      CLERK_ISSUER_URL: https://clerk.example.invalid
      CLERK_AUTHORIZED_PARTIES: http://localhost:5173
      CLERK_ADMIN_CLAIM: admin
      STORAGE_PROVIDER: gcs
      GCP_PROJECT_ID: ci-project
      GCS_BUCKET_NAME: ci-bucket
      GCS_PUBLIC_BASE_URL: https://example.invalid/storage
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest ruff

      - name: Verify backend import
        run: python -c "import app.main"

      - name: Run backend tests
        run: pytest

      - name: Run ruff lint
        run: ruff check . --no-cache

      - name: Run ruff format check
        run: ruff format . --check --no-cache

      - name: Detect mypy configuration
        id: mypy
        shell: bash
        run: |
          if [[ -f mypy.ini || -f .mypy.ini || -f setup.cfg ]] || grep -q '^\[tool\.mypy\]' pyproject.toml; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install mypy
        if: steps.mypy.outputs.configured == 'true'
        run: python -m pip install mypy

      - name: Run mypy
        if: steps.mypy.outputs.configured == 'true'
        run: mypy backend/src tests

  frontend:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: https://api.example.invalid
      VITE_CLERK_PUBLISHABLE_KEY: pk_test_synthetic
      VITE_CLERK_SIGN_IN_URL: /admin/login
      VITE_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /admin/dashboard
      VITE_CLERK_SIGN_OUT_FALLBACK_REDIRECT_URL: /admin/login
      VITE_CLERK_ADMIN_CLAIM: admin
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Test frontend configuration
        working-directory: frontend
        run: npm test
