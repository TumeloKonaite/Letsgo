name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend/src
      LETSGOSA_DATABASE_URL: sqlite:///./letsgosa.db
      GCP_PROJECT_ID: ci-project
      FIREBASE_PROJECT_ID: ci-project
      FIREBASE_ADMIN_ROLE: admin
      GCS_BUCKET_NAME: ci-bucket
      GCS_PUBLIC_BASE_URL: https://example.invalid/storage
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest ruff

      - name: Verify backend import
        run: python -c "import app.main"

      - name: Run backend tests
        run: pytest

      - name: Run ruff lint
        run: ruff check . --no-cache

      - name: Run ruff format check
        run: ruff format . --check --no-cache

      - name: Detect mypy configuration
        id: mypy
        shell: bash
        run: |
          if [[ -f mypy.ini || -f .mypy.ini || -f setup.cfg ]] || grep -q '^\[tool\.mypy\]' pyproject.toml; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install mypy
        if: steps.mypy.outputs.configured == 'true'
        run: python -m pip install mypy

      - name: Run mypy
        if: steps.mypy.outputs.configured == 'true'
        run: mypy backend/src tests

  frontend:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: https://example.invalid/api
      VITE_FIREBASE_API_KEY: test-api-key
      VITE_FIREBASE_AUTH_DOMAIN: example.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: ci-project
      VITE_FIREBASE_APP_ID: 1:1234567890:web:abcdef
      VITE_FIREBASE_STORAGE_BUCKET: example.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
      VITE_FIREBASE_ADMIN_CLAIM: admin
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
